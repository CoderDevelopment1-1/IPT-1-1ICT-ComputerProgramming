<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Comparison Operators</title>
</head>
<body>
    <h1>JavaScript Comparison Operator.</h1>
    <label for="First">Enter First Value:</label>
    <input type="number" name="First" id="num1" placeholder="Enter First Value...." required><br><br>
    <label for="second">Enter Second Value:</label>
    <input type="number" name="second" id="num2" placeholder="Enter Second Value...." required><br><br>
    <button onclick="compare()">Compare</button>
    <p id="result1"></p>
    <p id="result2"></p>
    <p id="result3"></p>
    <p id="result4"></p>
    <p id="result5"></p>
    <p id="result6"></p>
    <p id="result7"></p>
    <p id="result8"></p>
    <br><br><br><br><br>
    <h1>JavaScript Assignment Operator.</h1>
    <label for="Value">Enter your Value:</label>
    <input type="number" name="Value" id="enterValue" placeholder="Enter The Value....."><br><br>
    <button onclick="assignment()">=</button>
    <button onclick="addAssignment()">+=</button>
    <button onclick="subAssignment()">-=</button>
    <button onclick="multiAssignment()">*=</button>
    <button onclick="divAssignment()">/=</button>
    <p id="result">Updated Value:</p>
    <br><br><br><br><br>
    <h1>JavaScript Calculator.</h1>
    <label for="1stV">First Value:</label>
    <input type="number" name="1stV" id="firstValue" placeholder="Enter your Value...."><br><br>
    <label for="2ndV">Second Value:</label>
    <input type="number" name="2ndV" id="secondValue" placeholder="Enter your Value...."><br><br>
    <button onclick="add()">+</button>
    <button onclick="sub()">-</button>
    <button onclick="multi()">*</button>
    <button onclick="divi()">/</button>
    <button onclick="exp()">**</button>
    <button onclick="mod()">%</button>
    <p id="res"></p>
</body>
<script src="script.js"></script>
</html>
